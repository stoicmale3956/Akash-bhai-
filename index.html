<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confidential File</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at top left, #8b0000, transparent 35%),
        radial-gradient(circle at bottom right, #4a0000, transparent 40%),
        #090303;
    color: #fff;
}

.container {
    width: 90%;
    max-width: 430px;
    padding: 38px;
    text-align: center;

    background: rgba(35, 5, 5, 0.75);
    border: 1px solid rgba(255, 70, 70, 0.25);
    border-radius: 25px;

    backdrop-filter: blur(20px);

    box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.7),
        0 0 50px rgba(150, 0, 0, 0.15);
}

.lock {
    width: 78px;
    height: 78px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #ff1e1e,
        #8b0000
    );

    font-size: 32px;

    box-shadow:
        0 10px 35px rgba(255, 0, 0, 0.35);
}

h1 {
    margin-top: 22px;
    font-size: 28px;
    letter-spacing: 0.5px;
}

.subtitle {
    margin-top: 10px;
    color: #c7a7a7;
    font-size: 14px;
    line-height: 1.6;
}

.file {
    margin: 25px 0;
    padding: 16px;

    border-radius: 14px;

    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 80, 80, 0.12);

    text-align: left;
}

.file-name {
    font-weight: 600;
}

.file-status {
    margin-top: 6px;
    font-size: 12px;
    color: #ff5c5c;
}

input {
    width: 100%;
    padding: 15px;

    border: 1px solid rgba(255, 80, 80, 0.2);
    border-radius: 12px;

    outline: none;

    background: rgba(0, 0, 0, 0.35);
    color: white;

    font-size: 15px;
    margin-bottom: 13px;
}

input:focus {
    border-color: #ff3333;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.15);
}

input::placeholder {
    color: #806666;
}

button {
    width: 100%;
    padding: 15px;

    border: none;
    border-radius: 12px;

    cursor: pointer;

    color: white;
    font-size: 15px;
    font-weight: 600;

    background: linear-gradient(
        135deg,
        #ff3030,
        #a50000
    );

    transition: 0.25s;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 30px rgba(255, 0, 0, 0.3);
}

#error {
    margin-top: 12px;
    color: #ff6262;
    font-size: 13px;
    display: none;
}

.footer {
    margin-top: 25px;
    font-size: 11px;
    color: #806b6b;
}
</style>
</head>

<body>

<div class="container">

    <div class="lock">🔐</div>

    <h1>Confidential File</h1>

    <p class="subtitle">
        This file is protected. Enter the authorized
        access code to continue.
    </p>

    <div class="file">
        <div class="file-name">
            📄 Confidential_File.pdf
        </div>

        <div class="file-status">
            ● PROTECTED ACCESS
        </div>
    </div>

    <input
        type="password"
        id="password"
        placeholder="Enter access code"
    >

    <button onclick="unlockFile()">
        🔓 Unlock File
    </button>

    <div id="error">
        Incorrect access code.
    </div>

    <div class="footer">
        🔒 AUTHORIZED ACCESS ONLY
    </div>

</div>

<script>

function unlockFile() {

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    const correctPassword = "12345";

    if (password === correctPassword) {

        window.location.href =
        "https://stoicmale3956.github.io/Akash-bhai/";

    } else {

        error.style.display = "block";

    }
}

</script>

</body>
</html>
